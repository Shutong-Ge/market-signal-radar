<style>
:root{--navy:#16324F;--navy2:#1F4E79;--blue:#1F6FB2;--blue-l:#EAF3FB;--red:#C0392B;--red-l:#FBEDEB;
--amber:#B26A00;--amber-l:#FDF3E1;--green:#2E9E5B;--green-l:#E9F7EF;--bg:#F4F7FA;--card:#fff;
--ink:#22303E;--grey:#8A939E;--line:#E4EAF0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--ink);display:flex;overflow:hidden;font-size:14px}
.sidebar{width:228px;min-width:228px;background:linear-gradient(168deg,var(--navy),var(--navy2));color:#fff;
display:flex;flex-direction:column;padding:20px 14px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 20px}
.logo .ic{width:38px;height:38px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(31,111,178,.4)}
.logo b{font-size:15.5px}.logo small{display:block;font-size:9.5px;color:#9FB6CC;font-weight:400;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;color:#C6D4E2;text-decoration:none;font-size:13.5px;padding:10px 12px;border-radius:9px;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.nav .cnt{margin-left:auto;background:var(--blue);border-radius:99px;font-size:10px;padding:1px 7px;font-weight:700}
.spacer{flex:1}
.pipe{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 13px;font-size:11px;color:#C6D4E2;line-height:1.75}
.pipe b{color:#fff}
.pipe .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ADE80;margin-right:6px;box-shadow:0 0 6px #4ADE80}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px;flex:none}
.topbar h1{font-size:15px;font-weight:700;color:var(--navy)}
.badge{font-size:11px;padding:3.5px 10px;border-radius:99px;background:var(--blue-l);color:var(--blue);font-weight:600}
.badge.o{background:var(--amber-l);color:var(--amber)}
.badge.g{background:var(--green-l);color:var(--green)}
.tb-right{margin-left:auto;font-size:11.5px;color:var(--grey)}
.content{flex:1;overflow-y:auto;padding:20px 22px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.kpi .l{font-size:11.5px;color:var(--grey);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;color:var(--navy);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v.b{color:var(--blue)}.kpi .v.r{color:var(--red)}.kpi .v.g{color:var(--green)}
.kpi .s{font-size:10.5px;color:var(--grey);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.panel .hd{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel .hd b{font-size:13.5px;color:var(--navy)}
.panel .hd .sub{font-size:11.5px;color:var(--grey)}
.panel .hd .right{margin-left:auto;font-size:11.5px;color:var(--grey)}
.pd{padding:14px 18px}
table.q{width:100%;border-collapse:collapse;font-size:12.5px}
table.q th{background:#F8FAFC;color:var(--grey);font-weight:600;text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);font-size:11.5px}
table.q td{padding:9px 14px;border-bottom:1px solid #F0F4F8}
table.q tr.row{cursor:pointer}
table.q tr.row:hover{background:#F6FAFD}
.lv{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.lv.爆点{background:var(--red-l);color:var(--red)}
.lv.高热{background:var(--amber-l);color:var(--amber)}
.lv.升温中{background:var(--blue-l);color:var(--blue)}
.lv.一般{background:#EEF1F4;color:var(--grey)}
.hbar{display:inline-block;width:70px;height:7px;border-radius:4px;background:#EDF1F5;vertical-align:1px;margin-right:7px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#F5862B,#C0392B)}
.tag{display:inline-block;font-size:10px;background:var(--blue-l);color:var(--blue);border-radius:5px;padding:1px 6px;margin-right:4px}

.funnel{display:flex;flex-direction:column;gap:9px}
.fn-row{display:flex;align-items:center;gap:11px;font-size:12.5px}
.fn-row .nm{width:150px;color:var(--ink);flex:none}
.fn-track{flex:1;height:26px;background:#F1F5F9;border-radius:7px;position:relative;overflow:hidden}
.fn-track i{display:block;height:100%;background:linear-gradient(90deg,#2B7FC4,#1F6FB2);border-radius:7px}
.fn-track span{position:absolute;left:11px;top:5px;color:#fff;font-size:11.5px;font-weight:700}
.fn-cut{width:120px;text-align:right;color:var(--red);font-weight:700;font-size:12px}
/* 因子条 */
.fb{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:11.5px}
.fb .fn2{width:92px;color:var(--grey);flex:none}
.fb .tk{flex:1;height:8px;background:#EDF1F5;border-radius:4px;overflow:hidden}
.fb .tk i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.fb .vv{width:44px;text-align:right;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.sec{border-left:3px solid var(--blue);background:#FBFCFE;border-radius:0 8px 8px 0;padding:9px 13px;margin-bottom:9px;font-size:12.5px;line-height:1.85}

.frow .lbl{font-size:11px;color:var(--grey);width:52px;flex:none}
.chip{font-size:12px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);

.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.chip .n{opacity:.62;margin-left:4px;font-size:11px}
.chip.sub{border-style:dashed}
.chip.sub.on{background:var(--blue);border-color:var(--blue);border-style:solid}
.fnone{font-size:12px;color:var(--grey);padding:16px 14px}
td .subtag{display:inline-block;font-size:10.5px;color:var(--blue);background:#EAF3FB;
  border-radius:3px;padding:1px 6px;margin-left:5px;white-space:nowrap}
.cite{border-left:3px solid var(--amber);background:#FFFDF9;border-radius:0 7px 7px 0;padding:6px 11px;font-size:11.5px;color:#5B6772;margin-bottom:5px}
.cite a{color:var(--navy);text-decoration:none;border-bottom:1px solid rgba(22,50,79,.28)}
.cite a:hover{color:var(--blue);border-bottom-color:var(--blue)}
.src-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.src-row{display:flex;gap:10px;align-items:baseline;background:var(--card);padding:7px 11px;font-size:12px;text-decoration:none;color:var(--ink)}
.src-row:hover{background:#F6FAFD}
.src-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-row:hover .t{color:var(--blue);text-decoration:underline}

.src-row .go{flex:none;color:#9FB6C9;font-size:11px}

      ${rep.citations.slice(0,8).map(ct=>`<div class="cite">[${ct.n}]（${ct.media}）${ct.url?`<a href="${ct.url}" target="_blank" rel="noopener noreferrer">${ct.title}</a>`:ct.title}
        <code>rrf=${ct.rrf} bm25#${ct.bm25_rank??'—'} vec#${ct.vec_rank??'—'}</code></div>`).join('')}</div>
      <div class="note" style="margin-top:10px">召回归因：仅BM25 ${rep.retrieval.bm25_only} · 仅向量 ${rep.retrieval.vec_only} · 双路 ${rep.retrieval.both} · 融合捞回 ${rep.retrieval.neither_topk??0}</div>
    </div></div>`:'<div class="panel"><div class="pd note">该热点未进入 Top5 限流范围，未生成深度报告（LLM 成本控制）。</div></div>'}`;
}

function pipe(){
  const d=D.dedup, c=D.cluster;
  const steps=[['窗口内原始文章',d.n_in,''],
    ['L1 精确去重后',d.n_in-d.l1,`-${d.l1}`],
    ['L2 SimHash近似后',d.n_in-d.l1-d.l2,`-${d.l2}`],
    ['L3 语义去重后',d.n_out,`-${d.l3}`]];
  const mx=steps[0][1];
  return `
  <div class="panel"><div class="hd"><b>数据管道漏斗</b><span class="sub">每层拦截量均为真实运行结果</span>
    <div class="right">去重耗时 ${d.elapsed}s · 聚类 ${c.elapsed}s</div></div>
    <div class="pd"><div class="funnel">
    ${steps.map(([n,v,cut])=>`<div class="fn-row"><span class="nm">${n}</span>
      <span class="fn-track"><i style="width:${v/mx*100}%"></i><span>${F(v)}</span></span>
      <span class="fn-cut">${cut}</span></div>`).join('')}
    </div>
    <div class="note" style="margin-top:10px">采集侧：累计抓取 ${F(D.collect.fetched)} 条、入库 ${F(D.collect.inserted)} 条、URL层哈希拦截 ${D.collect.dup} 条（<b>口径说明</b>：该统计仅覆盖走采集器记录的批次；历史回补批次经直连写库未计入运行日志，因此采集侧数字小于库内实际量 ${F(D.collect.total)} 条——埋点缺口已如实标注，不做数字对齐修饰）。</div>
    <div class="note" style="margin-top:8px">聚类：${F(c.components)} 个连通分量 → 多篇簇 → 过滤程式化公告 ${c.noise} 个、单一媒体簇 ${c.single} 个 → <b>有效热点 ${c.n} 个</b>（模式：${c.mode==='vector'?'向量近邻（主）':'关键词规则（降级）'}）</div>
    </div></div>

  <div class="panel"><div class="hd"><b>去重证据留痕</b><span class="sub">每层实际拦截了什么——可人工复核，不是黑箱</span></div>
    <div class="pd">
      <b style="font-size:12.5px;color:var(--navy)">L1 精确层（同稿多频道/多媒体收录）</b>
      ${(d.examples.L1||[]).slice(0,3).map(x=>`<div class="pair"><b>保留</b> ${x.kept.slice(0,54)}<br><span class="dr">丢弃</span> ${x.dropped.slice(0,54)}</div>`).join('')}
      <b style="font-size:12.5px;color:var(--navy)">L2 SimHash 近似层（标题改写/删节）</b>
      ${(d.examples.L2||[]).slice(0,3).map(x=>`<div class="pair"><b>保留</b> ${x.kept.slice(0,54)}<br><span class="dr">丢弃</span> ${x.dropped.slice(0,54)} <code style="font-size:10px">汉明距${x.hamming}</code></div>`).join('')}
      <b style="font-size:12.5px;color:var(--navy)">L3 语义层（同事件不同表述）</b>
      ${(d.examples.L3||[]).slice(0,4).map(x=>`<div class="pair"><b>保留</b> ${x.kept.slice(0,54)}<br><span class="dr">丢弃</span> ${x.dropped.slice(0,54)} <code style="font-size:10px">cos=${x.cos}</code></div>`).join('')}
    </div></div>

  <div class="panel"><div class="hd"><b>采集站点状态</b><span class="sub">单站失败不影响整体（异常隔离）</span></div>
    <table class="q"><tr><th>媒体</th><th>频道</th><th>抓取</th><th>新增</th><th>状态</th></tr>
    ${D.collect.sites.map(s=>`<tr><td>${s.media}</td><td>${s.channel}</td><td class="mono">${s.fetched}</td>
      <td class="mono">${s.inserted}</td><td>${s.status==='ok'?'<span class="lv 升温中">正常</span>':`<span class="lv 爆点">${s.status}</span>`}</td></tr>`).join('')}
    </table></div>

  <div class="panel"><div class="hd"><b>数据源登记表</b>
    <span class="sub">接了什么 / 还能接什么 / 接不了什么——三种状态分开写</span>
    <div class="right">${(D.registry||[]).filter(r=>r.s==='live').length} 已接入 ·
      ${(D.registry||[]).filter(r=>r.s==='public').length} 可接入 ·
      ${(D.registry||[]).filter(r=>r.s==='licensed').length} 需授权</div></div>
    <table class="q"><tr><th>分组</th><th>数据源</th><th>状态</th><th>说明</th></tr>
    ${(D.registry||[]).map(r=>`<tr>
      <td class="note" style="white-space:nowrap">${r.g}</td>
      <td>${r.name}</td>
      <td><span class="lv ${r.s==='live'?'升温中':(r.s==='public'?'一般':'爆点')}"
        style="white-space:nowrap">${(D.registry_label||{})[r.s]||r.s}</span></td>
      <td class="note">${r.note}</td></tr>`).join('')}
    </table>
    <div class="pd note">商业终端（Wind / iFinD / Choice / Bloomberg / LSEG / FactSet / Capital IQ）
      与券商内部报告库按机构席位授权、无公开接口，个人项目<b>不具备合法接入条件</b>。
      本项目按同一套 adapter 协议为其预留接口位，生产环境取得授权后补实现即可——
      在此之前页面如实标注为未接入，不计入任何采集口径。</div></div>

  <div class="panel"><div class="hd"><b>热度模型标定</b></div><div class="pd note">
    窗口内对数归一：最大簇 ${c.calib.max_size} 篇、最大首日 ${c.calib.max_first} 篇、窗口 ${c.calib.window_days} 天、媒体数 ${c.calib.n_media_total}。<br>
    原设计使用固定分母（/50、/20），换数据规模后热度分全部挤在低分区、分级失效；改为按当期分布对数归一，自适应规模且严格保序。代价：热度绝对值不跨期可比，仅用于期内排序——这一点在晨报口径页也如实标注。
  </div></div>`;
}

function evalv(){
  const e=D.eval, s=e.summary;
  return `
  <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="l">两路召回集重合度</div><div class="v b">${(s.avg_jaccard*100).toFixed(0)}%</div><div class="s">Jaccard 均值 · ${s.n_queries} 个 query</div></div>
    <div class="kpi"><div class="l">重合文档名次差</div><div class="v">${s.avg_rank_diff}</div><div class="s">重合≠等价</div></div>
    <div class="kpi"><div class="l">只用BM25会漏</div><div class="v r">${s.avg_missed_by_bm25}</div><div class="s">篇/query（Top${s.top_k}）</div></div>
    <div class="kpi"><div class="l">只用向量会漏</div><div class="v r">${s.avg_missed_by_vector}</div><div class="s">篇/query（Top${s.top_k}）</div></div>
  </div>
  <div class="panel"><div class="hd"><b>检索对照评测</b><span class="sub">BM25 / 向量 / RRF——用数据回答"混合检索值不值"</span></div>
    <table class="ev-tab"><tr><th>提问形态</th><th>query</th><th>重合度</th><th>名次差</th><th>仅向量能召回</th><th>仅BM25能召回</th></tr>
    ${e.per_query.map(r=>`<tr><td><b>${r.type}</b></td><td>${r.query.slice(0,26)}</td>
      <td class="mono">${r.jaccard}</td><td class="mono">${r.rank_diff}</td>
      <td class="mono" style="color:var(--blue)">${r.missed_by_bm25}</td>
      <td class="mono" style="color:var(--amber)">${r.missed_by_vector}</td></tr>`).join('')}
    </table>
    <div class="pd note">${s.conclusion}</div></div>
  <div class="panel"><div class="hd"><b>生成侧治理指标</b></div><div class="pd note">
    引擎：${D.rag.engine} · 生成 ${D.rag.n} 篇 · 模板降级 ${D.rag.degraded} 篇 · 总耗时 ${D.rag.elapsed}s<br>
    ${D.rag.cite_rate==null
      ? `<b style="color:var(--amber)">引用标注覆盖率：本次无 LLM 产出</b>：本次全部走模板降级（未配置生成模型），
         引用覆盖率无从计算。`
      : `<b style="color:var(--amber)">引用标注覆盖率 ${(D.rag.cite_rate*100).toFixed(0)}%</b>：提示词明确要求句末标注 [n]（且给了带标注的样例），
         实测小模型仍大量省略。`}
    结论——<b>可溯源性不能只靠提示词约束，要靠架构</b>：本项目的引用清单由检索层独立产出并与报告并排展示，
    即便模型不标注，每条结论的候选材料仍然可核验。生产环境接强模型 API 可显著改善标注遵循度。
  </div></div>`;
}

function show(v){
  view=v;
  document.querySelectorAll('.nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  $('title').textContent={board:'热点看板',detail:'深度分析',pipe:'数据管道',eval:'检索评测'}[v];
  $('content').innerHTML={board:board,detail:detail,pipe:pipe,eval:evalv}[v]();
  $('content').scrollTop=0;
}
show('board');
</script>
</body>
</html>
